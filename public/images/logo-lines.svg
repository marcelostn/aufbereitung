<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 52" fill="none">

  <!-- ═══════════════════════════════════════════ -->
  <!--   AUTO – LINIENZEICHNUNG  (Iconbereich 0-52) -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Karosserie-Oberkante (Heck → Dach → Motorhaube) -->
  <path d="M 4 27 L 15 11 L 37 11 L 43 18 Q 47 23 47 31"
        stroke="#f59e0b" stroke-width="2.2"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Heckstoßstange (senkrecht) -->
  <line x1="4" y1="27" x2="4" y2="31"
        stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Unterboden – Hecksegment (vor hinterem Radkasten) -->
  <line x1="4" y1="31" x2="7" y2="31"
        stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Hinterer Radkasten (konkave Wölbung) -->
  <path d="M 7 31 Q 14 40 21 31"
        stroke="#f59e0b" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Unterboden – Mittelsegment -->
  <line x1="21" y1="31" x2="33" y2="31"
        stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Vorderer Radkasten -->
  <path d="M 33 31 Q 40 40 47 31"
        stroke="#f59e0b" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Räder (Kreis + Felgenmittelpunkt) -->
  <circle cx="14" cy="40" r="6.5" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="14" cy="40" r="2.2"  fill="#f59e0b"/>

  <circle cx="40" cy="40" r="6.5" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="40" cy="40" r="2.2"  fill="#f59e0b"/>

  <!-- Fenster / Kabinenbereich -->
  <path d="M 17 11 L 15 23 L 35 23 L 37 11"
        stroke="#f59e0b" stroke-width="1.5" fill="none"
        stroke-linejoin="round" opacity="0.7"/>

  <!-- B-Säule (Fensterteiler) -->
  <line x1="27" y1="11" x2="26.5" y2="23"
        stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>

  <!-- Türlinie (unterhalb Fensterkante) -->
  <line x1="26.5" y1="23" x2="26" y2="31"
        stroke="#f59e0b" stroke-width="1.1" stroke-linecap="round" opacity="0.35"/>

  <!-- Scheinwerfer-Akzent (helle Kurzlinie vorne) -->
  <line x1="46" y1="22" x2="49" y2="25"
        stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rücklicht-Akzent (kurze rote Linie hinten) -->
  <line x1="3" y1="28" x2="3" y2="31"
        stroke="#fca5a5" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- ═══════════════ -->
  <!--   WORDMARK     -->
  <!-- ═══════════════ -->

  <!-- Firmenname: "Auto" weiß + "Care" amber – Platzhalter -->
  <text x="62" y="30"
        font-family="Inter, 'Arial Narrow', Arial, sans-serif"
        font-weight="900" font-size="22" letter-spacing="-0.5">
    <tspan fill="white">Auto</tspan><tspan fill="#fbbf24">Care</tspan>
  </text>

  <!-- Dünne Trennlinie -->
  <line x1="62" y1="35" x2="186" y2="35"
        stroke="#f59e0b" stroke-width="0.7" opacity="0.25"/>

  <!-- Standort-Untertitel -->
  <text x="63" y="46"
        font-family="Inter, Arial, sans-serif"
        font-weight="500" font-size="9.5"
        fill="#b45309" letter-spacing="2.5">CLOPPENBURG</text>

</svg>
